<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="register-container">
    <h2>Register a New Account</h2>
    <input type="text" id="regName" placeholder="Name" />
    <input type="text" id="regMobile" placeholder="Mobile number" />
    <input type="email" id="regEmail" placeholder="Email" />
    <input type="text" id="regNID" placeholder="National ID Card Number" />
    <input type="date" id="regDOB" />
    <input type="password" id="regPassword" placeholder="Password" />
    <input type="password" id="regPIN" placeholder="4-digit PIN" maxlength="4" />
    <input type="text" id="regDivision" placeholder="Select Division" />
    <button onclick="register()">Register</button>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
